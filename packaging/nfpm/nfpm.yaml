name: mechanix-camera
arch: "${PKG_ARCH}"
platform: linux
version: "${PKG_VERSION}"
release: "${PKG_RELEASE}"
section: utils
priority: optional
maintainer: "Ojas <ojasc@ext.mechasystems.com>"
description: Mechanix Camera application
homepage: https://github.com/mecha-org/mechanix-camera.git
license: BSD

overrides:
  rpm:
    depends:
      - mechanix-flutter-engine = 3.47.0
  deb:
    depends:
      - "mechanix-flutter-engine (= 3.47.0)"

contents:
  - src: ./stage/bundle/mechanix_camera
    dst: /usr/share/mechanix/mechanix-camera/mechanix_camera
    file_info:
      mode: 0755
  - src: ./stage/bundle/lib/libapp.so
    dst: /usr/share/mechanix/mechanix-camera/lib/libapp.so
  - src: ./stage/bundle/lib/libcamera_elinux_plugin.so
    dst: /usr/share/mechanix/mechanix-camera/lib/libcamera_elinux_plugin.so
  - src: ./stage/bundle/data
    dst: /usr/share/mechanix/mechanix-camera/data
  - src: ./packaging/nfpm/scripts/launcher.sh
    dst: /usr/bin/mechanix_camera
    file_info:
      mode: 0755
  - src: ./org.mechanix.camera.desktop
    dst: /usr/share/applications/org.mechanix.camera.desktop
  - src: ./assets/desktop_icon.png
    dst: /usr/share/icons/hicolor/48x48/apps/org.mechanix.camera.png

scripts:
  postinstall: ./packaging/nfpm/scripts/postinstall.sh
  postremove: ./packaging/nfpm/scripts/postremove.sh
